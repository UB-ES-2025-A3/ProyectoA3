name: Backend Test & Coverage

on:
  push:
    branches: [ main, pre_prod, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test-coverage.yml'
  pull_request:
    branches: [ main, pre_prod, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test-coverage.yml'

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          CI: true
        run: npm run test:coverage   # ajusta si usas otro script

      - name: Upload backend coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/lcov-report

      - name: Upload backend coverage lcov file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-lcov
          path: backend/coverage/lcov.info

      # --- Generar resumen de coverage en markdown ---
      - name: Generate backend coverage summary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/coverage/lcov.info
          format: markdown
          output: file
          badge: false
          fail_below_min: false

      # --- Comentar en la PR con el resumen de coverage (backend) ---
      - name: Comment backend coverage summary on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
          header: backend-coverage
