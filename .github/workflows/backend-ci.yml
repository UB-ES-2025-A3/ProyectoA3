name: Backend • CI (Tests only)

on:
  push:
    paths:
      - 'backend/**'        # en push solo si toca backend
    branches:
      - dev
      - pre_prod
      - main
  pull_request:
    branches:
      - dev
      - pre_prod
      - main               # en PR siempre, toque lo que toque

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Maven settings with mirrors
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <mirrors>
              <mirror>
                <id>central-repo</id>
                <mirrorOf>central</mirrorOf>
                <url>https://repo1.maven.org/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests (perfil test)
        run: |
          mvn -q -DskipTests=false -Dspring.profiles.active=test test || \
          (echo "Maven failed — retrying..." && sleep 5 && mvn -q -DskipTests=false -Dspring.profiles.active=test test)
